[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insai"
version = "0.0.1"
description = "Insai's tools for coding agents. Today: the Workbench CLI, MCP server and skills (nexus-workbench)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Insai" }]
dependencies = ["nexus-workbench>=0.2.1"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/Insai/nexus-workbench"
Source = "https://github.com/Insai/nexus-workbench/tree/main/packages/insai"

[project.scripts]
insai = "nexus_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insai"]
