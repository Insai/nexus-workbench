name: Release

# Push a tag like v1.2.3 to build, publish to PyPI and create a GitHub release.
# Run it by hand (workflow_dispatch) for a dry build: it builds and uploads the files
# as an artifact, and publishes nothing.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/bump_version.py --check "$TAG"
      - name: Show the version (dry build)
        if: github.event_name != 'push'
        run: python3 scripts/bump_version.py --show
      - name: Install
        run: uv sync
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nexus-workbench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Write the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog_notes.py "$TAG" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --notes-file release-notes.md
          --verify-tag
