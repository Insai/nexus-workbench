name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Never paste a token, a recording or patient data here.
        For a security problem, use SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked the agent, and what you saw. Paste error text as is.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `nexus-workbench doctor`
      description: It shows only the last four characters of a token. Remove any paths you do not want to share.
      render: text
  - type: textarea
    id: debug
    attributes:
      label: Details from NEXUS_DEBUG=1 (optional)
      description: For "Something went wrong while reading the file", rerun with NEXUS_DEBUG=1 and paste the traceback, with file paths removed.
      render: text
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Command line only
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
