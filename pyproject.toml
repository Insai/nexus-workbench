[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-workbench"
version = "0.1.0.dev0"
description = "CLI, MCP server and skills that connect Claude Code and Codex to Insai Workbench, with local EEG file tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Insai" }]
keywords = ["eeg", "sleep", "mcp", "edf", "workbench"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.scripts]
nexus-workbench = "nexus_workbench.cli:main"
nexus = "nexus_workbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "nexus_workbench/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]
